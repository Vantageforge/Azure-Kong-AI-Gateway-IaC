<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'SF Mono','Consolas','Menlo',monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fc3f7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b389e0"/>
    </marker>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- card background -->
  <rect x="0" y="0" width="1200" height="620" rx="16" fill="#0b1220"/>
  <rect x="1" y="1" width="1198" height="618" rx="15" fill="none" stroke="#1c2a44" stroke-width="1"/>

  <text x="40" y="40" fill="#5eead4" font-size="13" letter-spacing="2" font-weight="600">REQUEST FLOW — LIVE TRAFFIC + CONTROL PLANE + TELEMETRY</text>

  <!-- Konnect control plane container -->
  <rect x="500" y="60" width="440" height="100" rx="10" fill="#0f2438" stroke="#1e4a68" stroke-width="1.5"/>
  <text x="520" y="82" fill="#7b8aa8" font-size="12">Kong Konnect — managed control plane</text>
  <rect x="560" y="95" width="320" height="50" rx="8" fill="#003459"/>
  <text x="720" y="116" fill="#e5edf7" font-size="13" font-weight="600" text-anchor="middle">Control Plane</text>
  <text x="720" y="133" fill="#c3d3e6" font-size="11" text-anchor="middle">Services · Routes · Plugins</text>

  <!-- Azure outer box -->
  <rect x="480" y="190" width="480" height="380" rx="10" fill="none" stroke="#2c72b0" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="500" y="216" fill="#5b9bd5" font-size="12" font-weight="600">Azure</text>

  <!-- AKS cluster box -->
  <rect x="500" y="230" width="440" height="320" rx="10" fill="#0f1c33" stroke="#24314f" stroke-width="1.5"/>
  <text x="520" y="254" fill="#7b8aa8" font-size="12">AKS cluster</text>

  <!-- namespace: kong -->
  <rect x="520" y="270" width="240" height="110" rx="8" fill="#101c30" stroke="#1c2a44" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="536" y="290" fill="#63758f" font-size="11">namespace: kong</text>
  <rect x="540" y="298" width="200" height="66" rx="8" fill="#0078D4"/>
  <text x="640" y="325" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Kong Gateway</text>
  <text x="640" y="342" fill="#dceaf9" font-size="11" text-anchor="middle">data plane node</text>

  <!-- namespace: datadog -->
  <rect x="520" y="400" width="240" height="110" rx="8" fill="#101c30" stroke="#1c2a44" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="536" y="420" fill="#63758f" font-size="11">namespace: datadog</text>
  <rect x="540" y="428" width="200" height="66" rx="8" fill="#632CA6"/>
  <text x="640" y="455" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Datadog Agent</text>
  <text x="640" y="472" fill="#ecdcf9" font-size="11" text-anchor="middle">logs · OpenMetrics · OTLP</text>

  <!-- Client node -->
  <rect x="40" y="291" width="180" height="80" rx="10" fill="#142238" stroke="#2c72b0" stroke-width="1.5"/>
  <text x="130" y="326" fill="#e5edf7" font-size="13" font-weight="600" text-anchor="middle">Client</text>
  <text x="130" y="344" fill="#a9bcd6" font-size="11" text-anchor="middle">sends request</text>

  <!-- Backend node -->
  <rect x="1000" y="291" width="160" height="80" rx="10" fill="#142238" stroke="#3fae6a" stroke-width="1.5"/>
  <text x="1080" y="326" fill="#e5edf7" font-size="13" font-weight="600" text-anchor="middle">Upstream</text>
  <text x="1080" y="344" fill="#a9bcd6" font-size="11" text-anchor="middle">backend</text>

  <!-- Datadog SaaS node -->
  <rect x="1000" y="426" width="160" height="80" rx="40" fill="#241a35" stroke="#632CA6" stroke-width="1.5"/>
  <text x="1080" y="461" fill="#e5edf7" font-size="13" font-weight="600" text-anchor="middle">Datadog</text>
  <text x="1080" y="479" fill="#c9a9e6" font-size="11" text-anchor="middle">SaaS</text>

  <!-- edges -->
  <path id="edgeClient" d="M220,331 L540,331" fill="none" stroke="#3a4a6b" stroke-width="2" marker-end="url(#arrow)"/>

  <path id="edgeBackend" d="M740,331 L1000,331" fill="none" stroke="#3a4a6b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="319" fill="#7b8aa8" font-size="10.5" text-anchor="middle">proxied via Service</text>

  <path id="edgeSyncDown" d="M660,270 L660,160" fill="none" stroke="#5b6f95" stroke-width="1.5" stroke-dasharray="6,4"/>
  <path id="edgeSyncUp"   d="M620,270 L620,160" fill="none" stroke="none"/>
  <text x="672" y="215" fill="#7b8aa8" font-size="10.5">config sync ↓</text>
  <text x="672" y="230" fill="#7b8aa8" font-size="10.5">status ↑ (mTLS)</text>

  <path id="edgeTelemetry" d="M640,378 L640,412" fill="none" stroke="#3a4a6b" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="760" y="399" fill="#7b8aa8" font-size="10.5" text-anchor="middle">logs, metrics, traces</text>

  <path id="edgeShips" d="M740,461 L1000,461" fill="none" stroke="#3a4a6b" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="870" y="449" fill="#7b8aa8" font-size="10.5" text-anchor="middle">ships to</text>

  <!-- animated flow dots -->
  <circle r="5" fill="#4fc3f7" filter="url(#glow)">
    <animateMotion dur="2.4s" repeatCount="indefinite">
      <mpath href="#edgeClient"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="#4fc3f7" filter="url(#glow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.3s">
      <mpath href="#edgeBackend"/>
    </animateMotion>
  </circle>

  <circle r="4" fill="#93a5c9" filter="url(#glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite">
      <mpath href="#edgeSyncDown"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#5eead4" filter="url(#glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.6s">
      <mpath href="#edgeSyncUp"/>
    </animateMotion>
  </circle>

  <circle r="4" fill="#b389e0" filter="url(#glow)">
    <animateMotion dur="1.4s" repeatCount="indefinite">
      <mpath href="#edgeTelemetry"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#b389e0" filter="url(#glow)">
    <animateMotion dur="2.6s" repeatCount="indefinite" begin="0.2s">
      <mpath href="#edgeShips"/>
    </animateMotion>
  </circle>

  <!-- legend -->
  <circle cx="52" cy="592" r="4" fill="#4fc3f7"/>
  <text x="64" y="596" fill="#7b8aa8" font-size="11">live request traffic</text>
  <circle cx="230" cy="592" r="4" fill="#93a5c9"/>
  <text x="242" y="596" fill="#7b8aa8" font-size="11">config sync / status (mTLS)</text>
  <circle cx="480" cy="592" r="4" fill="#b389e0"/>
  <text x="492" y="596" fill="#7b8aa8" font-size="11">telemetry (logs · metrics · traces)</text>
</svg>
