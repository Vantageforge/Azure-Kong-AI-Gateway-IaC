<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 260" font-family="'SF Mono','Consolas','Menlo',monospace">
  <defs>
    <filter id="glow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- card background -->
  <rect x="0" y="0" width="1270" height="260" rx="16" fill="#0b1220"/>
  <rect x="1" y="1" width="1268" height="258" rx="15" fill="none" stroke="#1c2a44" stroke-width="1"/>

  <text x="20" y="34" fill="#5eead4" font-size="13" letter-spacing="2" font-weight="600">CI/CD — decK LINT · DIFF · SYNC PIPELINE</text>

  <!-- swimlane bands -->
  <rect x="10" y="60" width="474" height="150" rx="12" fill="#101c30" stroke="#1c2a44" stroke-width="1"/>
  <text x="26" y="80" fill="#63758f" font-size="11" letter-spacing="1">ON PULL REQUEST</text>

  <rect x="494" y="60" width="766" height="150" rx="12" fill="#101c30" stroke="#1c2a44" stroke-width="1"/>
  <text x="510" y="80" fill="#63758f" font-size="11" letter-spacing="1">ON PUSH TO MAIN · MANUAL DISPATCH FOR PROD</text>

  <!-- connecting line -->
  <path id="pipeline" d="M20,135 L1249,135" fill="none" stroke="#3a4a6b" stroke-width="2"/>

  <!-- static direction chevrons -->
  <polygon points="158.5,128 169.5,135 158.5,142" fill="#3a4a6b"/>
  <polygon points="315.5,128 326.5,135 315.5,142" fill="#3a4a6b"/>
  <polygon points="472.5,128 483.5,135 472.5,142" fill="#3a4a6b"/>
  <polygon points="629.5,128 640.5,135 629.5,142" fill="#3a4a6b"/>
  <polygon points="786.5,128 797.5,135 786.5,142" fill="#3a4a6b"/>
  <polygon points="943.5,128 954.5,135 943.5,142" fill="#3a4a6b"/>
  <polygon points="1100.5,128 1111.5,135 1100.5,142" fill="#3a4a6b"/>

  <!-- node 0: Pull request -->
  <rect x="20" y="96" width="130" height="78" rx="10" fill="#142238" stroke="#3a4a6b" stroke-width="1.5"/>
  <text x="85" y="130" fill="#e5edf7" font-size="12.5" font-weight="600" text-anchor="middle">Pull request</text>
  <text x="85" y="147" fill="#a9bcd6" font-size="10.5" text-anchor="middle">kong-config/**</text>

  <!-- node 1: Lint -->
  <rect x="177" y="96" width="130" height="78" rx="10" fill="#10241c" stroke="#00A95C" stroke-width="1.5"/>
  <text x="242" y="130" fill="#e5edf7" font-size="12.5" font-weight="600" text-anchor="middle">deck file lint</text>
  <text x="242" y="147" fill="#8fd4b0" font-size="10.5" text-anchor="middle">rulesets/base.yaml</text>

  <!-- node 2: Diff -->
  <rect x="334" y="96" width="130" height="78" rx="10" fill="#10241c" stroke="#00A95C" stroke-width="1.5"/>
  <text x="399" y="130" fill="#e5edf7" font-size="12.5" font-weight="600" text-anchor="middle">deck gateway</text>
  <text x="399" y="145" fill="#e5edf7" font-size="12.5" font-weight="600" text-anchor="middle">diff</text>
  <text x="399" y="161" fill="#8fd4b0" font-size="10" text-anchor="middle">preview: dev + staging</text>

  <!-- node 3: Merge (hexagon) -->
  <path d="M491,135 L510.5,96 L601.5,96 L621,135 L601.5,174 L510.5,174 Z" fill="#24292f" stroke="#3a4a6b" stroke-width="1"/>
  <text x="556" y="131" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Merge to</text>
  <text x="556" y="147" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">main</text>

  <!-- node 4: Sync dev -->
  <rect x="648" y="96" width="130" height="78" rx="10" fill="#10241c" stroke="#00A95C" stroke-width="1.5"/>
  <text x="713" y="135" fill="#e5edf7" font-size="13" font-weight="600" text-anchor="middle">sync → dev</text>

  <!-- node 5: Sync staging -->
  <rect x="805" y="96" width="130" height="78" rx="10" fill="#10241c" stroke="#00A95C" stroke-width="1.5"/>
  <text x="870" y="135" fill="#e5edf7" font-size="13" font-weight="600" text-anchor="middle">sync → staging</text>

  <!-- node 6: Gate (hexagon) -->
  <path d="M962,135 L981.5,96 L1072.5,96 L1092,135 L1072.5,174 L981.5,174 Z" fill="#9a6700" stroke="#3a4a6b" stroke-width="1"/>
  <text x="1027" y="127" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Manual</text>
  <text x="1027" y="143" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">approval</text>
  <text x="1027" y="159" fill="#f6dfae" font-size="9.5" text-anchor="middle">prod Environment</text>

  <!-- node 7: Sync prod -->
  <rect x="1119" y="96" width="130" height="78" rx="10" fill="#10241c" stroke="#00A95C" stroke-width="2"/>
  <text x="1184" y="130" fill="#e5edf7" font-size="12.5" font-weight="600" text-anchor="middle">sync → prod</text>
  <text x="1184" y="147" fill="#8fd4b0" font-size="10" text-anchor="middle">after approval</text>

  <!-- animated flow dots -->
  <circle r="5.5" fill="#5eead4" filter="url(#glow2)">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#pipeline"/>
    </animateMotion>
  </circle>
  <circle r="5.5" fill="#5eead4" filter="url(#glow2)" opacity="0.6">
    <animateMotion dur="6s" repeatCount="indefinite" begin="3s">
      <mpath href="#pipeline"/>
    </animateMotion>
  </circle>

  <!-- legend -->
  <circle cx="26" cy="228" r="4" fill="#00A95C"/>
  <text x="38" y="232" fill="#7b8aa8" font-size="11">decK action</text>
  <path d="M180,228 L186,224 L192,228 L186,232 Z" fill="#24292f" stroke="#3a4a6b"/>
  <text x="202" y="232" fill="#7b8aa8" font-size="11">merge / gate checkpoint</text>
  <circle cx="420" cy="228" r="4" fill="#5eead4"/>
  <text x="432" y="232" fill="#7b8aa8" font-size="11">pipeline run in flight</text>
</svg>
