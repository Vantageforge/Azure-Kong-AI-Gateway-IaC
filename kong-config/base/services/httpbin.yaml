_format_version: "3.0"

# ---------------------------------------------------------------------------
# httpbin — smoke-test / demo backend.
# Ships enabled in every environment so `make kong-diff-dev` and the CI
# pipeline have something safe to sync against before real upstreams exist.
# ---------------------------------------------------------------------------
services:
  - name: httpbin
    url: '${{ env "DECK_HTTPBIN_UPSTREAM_URL" }}'
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 5
    tags:
      - env:${{ env "DECK_ENVIRONMENT" }}
      - team:platform
      - kind:demo
